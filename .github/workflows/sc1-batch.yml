name: Golden Dome roster (batch)

# One batch per run. When it finishes, the workflow dispatches the NEXT batch
# as a separate run and exits, so no single job ever approaches GitHub's
# 6-hour limit and no two batches ever run at the same time.
on:
  workflow_dispatch:
    inputs:
      start_row:
        description: "First sheet row for this batch (row 1 = header)"
        required: false
        default: "2"
      batch_size:
        description: "Members to process in this batch"
        required: false
        default: "10"
      sleep_seconds:
        description: "Cool-down before starting (rate-limit relief)"
        required: false
        default: "0"

# cancel-in-progress: false means a chained batch QUEUES rather than racing a
# still-running one. GitHub keeps only ONE pending run per group, so if two
# dispatches ever raced, the newer one replaces the older rather than stacking.
concurrency:
  group: golden-dome-roster
  cancel-in-progress: false

# 330 min leaves headroom under the 360 min job cap for the Ollama install and
# model pull, which happen inside this job and count against the same budget.
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      # Ollama runs ON the runner, so there is no API key, no quota and no
      # per-request cost. gemma3:1b matches the model sc1.py uses locally.
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl start ollama || (nohup ollama serve &)

      - name: Pull the model
        run: |
          ollama pull "${OLLAMA_MODEL:-gemma3:1b}"

      - name: Wait for Ollama to answer
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then
              echo "Ollama is up after ${i} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Ollama did not become ready in 300s"
          exit 1

      - name: Run the batch
        id: batch
        env:
          # Secrets live here and nowhere else: not on a command line (visible
          # in the process list and in logs) and not in the checkout.
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma3:1b' }}
          START_ROW: ${{ inputs.start_row }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
        run: bash ./run_batch.sh

      - name: Upload batch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-start-${{ inputs.start_row }}
          path: |
            ./results.json
            ./sc1_batch.log
          if-no-files-found: warn

      - name: Dispatch the next batch
        if: steps.batch.outputs.NO_MORE_ROWS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_ROW: ${{ steps.batch.outputs.NEXT_ROW }}
        run: |
          echo "Roster continues at row ${NEXT_ROW}; dispatching the next batch."
          gh workflow run "Golden Dome roster (batch)" \
            --ref "${GITHUB_REF_NAME}" \
            -f start_row="${NEXT_ROW}" \
            -f batch_size="${{ inputs.batch_size }}" \
            -f sleep_seconds="${{ inputs.sleep_seconds }}"

      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.batch.outputs.BATCH_RESULT }}
          NEXT_ROW: ${{ steps.batch.outputs.NEXT_ROW }}
          DONE: ${{ steps.batch.outputs.NO_MORE_ROWS }}
        run: |
          {
            echo "### Batch summary"
            echo ""
            echo "- **Outcome:** ${RESULT:-batch did not complete}"
            echo "- **Next row:** ${NEXT_ROW:-n/a}"
            echo "- **Roster complete:** ${DONE:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
